name: Eisbach Pegelverlauf 5 Tage
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HND Pegelverlauf laden
        run: python scripts/update_eisbach_history.py
      - name: Verlauf ins Repository uebernehmen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/eisbach-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Eisbach Pegelverlauf 5 Tage'
            git push
          fi
